global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'forgex-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080', 'host.docker.internal:8080']

  - job_name: 'forgex-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8000', 'host.docker.internal:8000']
