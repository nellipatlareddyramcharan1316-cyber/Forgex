name: ForgeX CI - Build

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-frontend:
    name: Build Frontend (Vite + React TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and Build Bundle
        working-directory: frontend
        run: npm run build

  build-backend:
    name: Build Backend (Java 21 + Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Maven Compile & Package
        working-directory: backend
        run: mvn clean compile -DskipTests

  build-ai-service:
    name: Build AI Microservice (Python FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      - name: Install Dependencies
        working-directory: ai-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
